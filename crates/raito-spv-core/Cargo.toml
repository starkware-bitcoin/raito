[package]
name = "raito-spv-core"
version = "0.1.0"
edition = "2021"

[features]
sqlite = ["accumulators/sqlite"]

[dependencies]
# Async runtime - properly configured for WASM
[target.'cfg(not(target_family = "wasm"))'.dependencies]
tokio = { workspace = true }

[target.'cfg(target_family = "wasm")'.dependencies]
tokio = { version = "1.36", default-features = false, features = ["rt", "macros", "sync", "io-util", "time"] }

# Merkle mountain range
accumulators = { git = "https://github.com/maciejka/rust-accumulators", rev = "ee3f20f5ef03de56376c1f0a6bc8c753e9725e33", features = ["blake", "memory", "mmr"]}

# Bitcoin RPC and types
#jsonrpsee.workspace = true
bitcoin.workspace = true
#bitcoincore-rpc-json.workspace = true
base64.workspace = true

# Serialization
serde.workspace = true
serde_json.workspace = true
hex.workspace = true

# BigInt (for sparse_roots serialization)
num-bigint.workspace = true
num-traits.workspace = true

# Error handling
thiserror.workspace = true
anyhow.workspace = true

# Logging
tracing.workspace = true

[dev-dependencies]
# Testing
mockall.workspace = true
tempfile.workspace = true 