[package]
name = "raito-spv-core"
version = "0.1.0"
edition = "2021"

[features]
sqlite = ["accumulators/sqlite"]

[dependencies]
# Async runtime
tokio.workspace = true

# Merkle mountain range
accumulators = { git = "https://github.com/maciejka/rust-accumulators", rev = "ee3f20f5ef03de56376c1f0a6bc8c753e9725e33", features = ["blake", "memory", "mmr"]}

# Bitcoin RPC and types
jsonrpsee.workspace = true
bitcoin.workspace = true
bitcoincore-rpc-json.workspace = true
base64.workspace = true

# Serialization
serde.workspace = true
serde_json.workspace = true
hex.workspace = true

# BigInt (for sparse_roots serialization)
num-bigint.workspace = true
num-traits.workspace = true

# Error handling
thiserror.workspace = true
anyhow.workspace = true

# Retry logic (for bitcoin client)
backoff = { version = "0.4", features = ["futures", "tokio"] }

# Logging
tracing.workspace = true

[dev-dependencies]
# Testing
mockall.workspace = true
tempfile.workspace = true 