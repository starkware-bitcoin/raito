[package]
name = "raito-cairo-args"
version = "0.1.0"
edition = "2021"
description = "Serialize Rust structures into Cairo/Scarb runner-compatible argument felts"
license = "MIT OR Apache-2.0"

[dependencies]
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
anyhow = { workspace = true }
hex = { workspace = true }
num-bigint = { workspace = true }
num-traits = { workspace = true }

# Adapters for project types
bitcoin = { workspace = true, optional = true, features = ["serde"] }
raito-spv-verify = { path = "../raito-spv-verify", optional = true }
raito-spv-mmr = { path = "../raito-spv-mmr", optional = true }

[features]
default = ["adapters"]
adapters = ["bitcoin", "raito-spv-verify", "raito-spv-mmr"]

[dev-dependencies]
serde_json = { workspace = true }

