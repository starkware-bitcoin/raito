[package]
name = "raito-spv-verify"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = { workspace = true }

# Core SPV functionality
raito-spv-mmr = { path = "../raito-spv-mmr" }

# Bitcoin types
bitcoin = { workspace = true }

# Logging
tracing = "0.1"

# Serialization
hex = "0.4.3"
serde = { workspace = true }
num-bigint = "0.4.3"
starknet-ff = "0.3.7" 

# Stwo-cairo
cairo-air = { git = "https://github.com/maciejka/stwo-cairo", rev = "7e0e3e7dd2f75b5891debf09573c93b54a088f96", default-features = false, features = ["std"] }

[target.'cfg(not(target_family = "wasm"))'.dependencies]
stwo-prover = { git = "https://github.com/starkware-libs/stwo", rev = "0e90b31", features = [
    "parallel",
], default-features = false }

[target.'cfg(target_family = "wasm")'.dependencies]
stwo-prover = { git = "https://github.com/starkware-libs/stwo", rev = "0e90b31", features = [], default-features = false }
