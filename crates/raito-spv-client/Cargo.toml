[package]
name = "raito-spv-client"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = { workspace = true }

# Core SPV functionality
raito-spv-core = { path = "../raito-spv-core" }
raito-spv-verify = { path = "../raito-spv-verify" }

# Bitcoin client
raito-bitcoin-client = { path = "../raito-bitcoin-client" }

# Bitcoin RPC and types
bitcoin = { workspace = true }
num-bigint = "0.4.3"

# CLI and env
clap = { workspace = true }
dotenv = { workspace = true }

# Async runtime
tokio = { workspace = true }
reqwest = { workspace = true }

# Logging
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

# Stwo-cairo
stwo-prover = { git = "https://github.com/starkware-libs/stwo", rev = "0e90b31", features = [
    "parallel",
], default-features = false }
cairo-air = { git = "https://github.com/maciejka/stwo-cairo", rev = "cb0525c6d06de29beed171119040ab1a12c8ba61", features = ["std"] }
starknet-ff = "0.3.7"

# Serialization
hex = "0.4.3"
serde = { workspace = true }
serde_json = { workspace = true }
bincode = "1.3"

# Compression
bzip2 = "0.4"

# Date/time handling
chrono = "0.4"
